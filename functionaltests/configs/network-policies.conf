# Dedicated mutable probes on the shared BGP peers.

# test_ipv4_community_filter_and_refresh
set interfaces dummy dum42061 address 198.19.61.21/32
set vrf name NVYRRIGHT protocols bgp address-family ipv4-unicast network 198.19.61.21/32
set policy prefix-list ipv4 RNCHANGE1 rule 10 action permit prefix 198.19.61.21/32
set policy route-map RNOUT4 rule 111 action permit match ipv4 prefix-list RNCHANGE1
set policy route-map RNIN4 rule 111 action permit match ipv4 prefix-list RNCHANGE1
set policy route-map RNOUT4 rule 111 set community 65062:100
set policy community-list standard RNCHANGE1 rule 10 action permit community 65062:100
set policy route-map RNIN4 rule 111 match community-list RNCHANGE1 exact-match
set policy route-map RNIN4 rule 111 set local-preference 250

# test_ipv4_as_path_filter_and_replace
set interfaces dummy dum42061 address 198.19.61.22/32
set vrf name NVYRRIGHT protocols bgp address-family ipv4-unicast network 198.19.61.22/32
set policy prefix-list ipv4 RNCHANGE2 rule 10 action permit prefix 198.19.61.22/32
set policy route-map RNOUT4 rule 112 action permit match ipv4 prefix-list RNCHANGE2
set policy route-map RNIN4 rule 112 action permit match ipv4 prefix-list RNCHANGE2
set policy route-map RNOUT4 rule 112 set as-path prepend "64501 64501"
set policy as-path-list RNCHANGE2 rule 10 action permit regex "_64501_"
set policy route-map RNIN4 rule 112 match as-path-list RNCHANGE2 as-path-count 3
set policy route-map RNIN4 rule 112 set as-path replace as-number 64501 replacement 64502

