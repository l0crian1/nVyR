# Operational route and disabled-neighbor views
set policy route-map RNOPPOLICY rule 10 action permit
set vrf name NVYRLEFT protocols bgp address-family ipv4-unicast network 192.0.2.0/24 route-map RNOPPOLICY
set vrf name NVYRLEFT protocols bgp address-family ipv6-unicast network 2001:db8::/48
set vrf name NVYRLEFT protocols bgp neighbor 192.0.2.2 remote-as 65001 shutdown address-family ipv4-unicast
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8::2 remote-as 65001 shutdown address-family ipv6-unicast
