# Unicast additions share the routed-network sessions and routing domains.
# Disruptive shutdown/port/role-mismatch behavior stays in explicit mutation tests.

# Capabilities, transport limits and complementary roles on the existing peers.
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 passive tcp-mss 1200 graceful-restart helper
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 role type provider strict
set vrf name NVYRRIGHT protocols bgp neighbor 198.18.60.1 role type customer strict
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 capability dynamic software-version
set vrf name NVYRRIGHT protocols bgp neighbor 198.18.60.1 capability dynamic software-version
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 timers advertisement-interval 0 delay-open 1
set vrf name NVYRRIGHT protocols bgp neighbor 198.18.60.1 timers advertisement-interval 0

set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 passive tcp-mss 1200 graceful-restart helper
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 role type provider strict
set vrf name NVYRRIGHT protocols bgp neighbor 2001:db8:60::1 role type customer strict
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 capability extended-nexthop dynamic link-local software-version
set vrf name NVYRRIGHT protocols bgp neighbor 2001:db8:60::1 capability extended-nexthop dynamic link-local software-version
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 timers advertisement-interval 0 delay-open 1
set vrf name NVYRRIGHT protocols bgp neighbor 2001:db8:60::1 timers advertisement-interval 0

# Limits comfortably exceed the complete scenario's route inventory.
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 address-family ipv4-unicast soft-reconfiguration inbound
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 address-family ipv4-unicast maximum-prefix limit 1000 threshold 90 warning-only force
set vrf name NVYRRIGHT protocols bgp neighbor 198.18.60.1 address-family ipv4-unicast maximum-prefix-out 1000 next-hop-self force
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 address-family ipv4-unicast addpath transmit best-selected 2
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 address-family ipv4-unicast addpath receive-limit 4
set vrf name NVYRRIGHT protocols bgp neighbor 198.18.60.1 address-family ipv4-unicast addpath transmit all

set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 address-family ipv6-unicast soft-reconfiguration inbound
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 address-family ipv6-unicast maximum-prefix limit 1000 threshold 90 warning-only force
set vrf name NVYRRIGHT protocols bgp neighbor 2001:db8:60::1 address-family ipv6-unicast maximum-prefix-out 1000 next-hop-self force
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 address-family ipv6-unicast addpath transmit best-selected 2
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 address-family ipv6-unicast addpath receive-limit 4
set vrf name NVYRRIGHT protocols bgp neighbor 2001:db8:60::1 address-family ipv6-unicast addpath transmit all
set vrf name NVYRLEFT protocols bgp address-family ipv6-unicast next-hop prefer-global

# Filter-list and peer weight affect dedicated received routes without changing existing policy probes.
set policy as-path-list RNUNIMPORT rule 10 action permit regex ".*"
set vrf name NVYRLEFT protocols bgp neighbor 198.18.60.2 address-family ipv4-unicast as-path-list import RNUNIMPORT weight 75
set vrf name NVYRLEFT protocols bgp neighbor 2001:db8:60::2 address-family ipv6-unicast as-path-list import RNUNIMPORT weight 75
set vrf name NVYRLEFT protocols bgp address-family ipv4-unicast distance external 30 internal 210 local 220
set vrf name NVYRLEFT protocols bgp address-family ipv6-unicast distance external 30 internal 210 local 220

# An unnumbered pair is created once alongside the original transit links.
# It exercises alternate-AS replacement without changing existing AS-path assertions.
set interfaces virtual-ethernet veth42067 peer-name veth42068 vrf NVYRLEFT
set interfaces virtual-ethernet veth42068 peer-name veth42067 vrf NVYRRIGHT

set policy prefix-list ipv4 RNUN4 rule 10 action permit prefix 198.19.65.2/32
set policy prefix-list ipv6 RNUN6 rule 10 action permit prefix 2001:db8:65::2/128
set policy route-map RNUN4 rule 10 action permit match ipv4 prefix-list RNUN4
set policy route-map RNUN6 rule 10 action permit match ipv6 prefix-list RNUN6

set vrf name NVYRRIGHT protocols bgp address-family ipv4-unicast network 198.19.65.2/32
set vrf name NVYRRIGHT protocols bgp address-family ipv6-unicast network 2001:db8:65::2/128
set interfaces dummy dum42061 address 198.19.65.2/32 address 2001:db8:65::2/128

set vrf name NVYRLEFT protocols bgp neighbor veth42067 remote-as 65162 ipv6-only
set vrf name NVYRLEFT protocols bgp neighbor veth42067 local-as number 65161
set vrf name NVYRLEFT protocols bgp neighbor veth42067 local-as no-prepend replace-as dual-as
set vrf name NVYRRIGHT protocols bgp neighbor veth42068 remote-as 65161 ipv6-only
set vrf name NVYRRIGHT protocols bgp neighbor veth42068 local-as number 65162
set vrf name NVYRRIGHT protocols bgp neighbor veth42068 local-as no-prepend replace-as dual-as

set vrf name NVYRLEFT protocols bgp neighbor veth42067 address-family ipv4-unicast route-map import RNUN4 export RNUN4
set vrf name NVYRLEFT protocols bgp neighbor veth42067 address-family ipv4-unicast weight 300
set vrf name NVYRRIGHT protocols bgp neighbor veth42068 address-family ipv4-unicast route-map import RNUN4 export RNUN4
set vrf name NVYRLEFT protocols bgp neighbor veth42067 address-family ipv6-unicast route-map import RNUN6 export RNUN6
set vrf name NVYRLEFT protocols bgp neighbor veth42067 address-family ipv6-unicast weight 300
set vrf name NVYRRIGHT protocols bgp neighbor veth42068 address-family ipv6-unicast route-map import RNUN6 export RNUN6

# Aggregates suppress only selected components; unsuppress-map restores those for this peer.
set policy prefix-list ipv4 RNUNAGG4 rule 10 action permit prefix 198.19.66.0/24 ge 24 le 32
set policy prefix-list ipv6 RNUNAGG6 rule 10 action permit prefix 2001:db8:66::/64 ge 64 le 128
set policy route-map RNIN4 rule 900 action permit match ipv4 prefix-list RNUNAGG4
set policy route-map RNIN6 rule 900 action permit match ipv6 prefix-list RNUNAGG6
set policy route-map RNUNAGG4 rule 10 action permit match ipv4 prefix-list RNUNAGG4
set policy route-map RNUNAGG6 rule 10 action permit match ipv6 prefix-list RNUNAGG6

set vrf name NVYRRIGHT protocols bgp address-family ipv4-unicast network 198.19.66.1/32
set vrf name NVYRRIGHT protocols bgp address-family ipv4-unicast aggregate-address 198.19.66.0/24 origin incomplete matching-med-only suppress-map RNUNAGG4
set vrf name NVYRRIGHT protocols bgp neighbor 198.18.60.1 address-family ipv4-unicast unsuppress-map RNUNAGG4
set vrf name NVYRRIGHT protocols bgp address-family ipv6-unicast network 2001:db8:66::1/128
set vrf name NVYRRIGHT protocols bgp address-family ipv6-unicast aggregate-address 2001:db8:66::/64 origin incomplete matching-med-only suppress-map RNUNAGG6
set vrf name NVYRRIGHT protocols bgp neighbor 2001:db8:60::1 address-family ipv6-unicast unsuppress-map RNUNAGG6

# Conditional advertisements use separate trigger prefixes; they do not gate the LAN routes.
set policy prefix-list ipv4 RNUNADV4 rule 10 action permit prefix 198.19.67.1/32
set policy prefix-list ipv4 RNUNCOND4 rule 10 action permit prefix 198.19.67.2/32
set policy prefix-list ipv6 RNUNADV6 rule 10 action permit prefix 2001:db8:67::1/128
set policy prefix-list ipv6 RNUNCOND6 rule 10 action permit prefix 2001:db8:67::2/128
set policy route-map RNUNADV4 rule 10 action permit match ipv4 prefix-list RNUNADV4
set policy route-map RNUNCOND4 rule 10 action permit match ipv4 prefix-list RNUNCOND4
set policy route-map RNUNADV6 rule 10 action permit match ipv6 prefix-list RNUNADV6
set policy route-map RNUNCOND6 rule 10 action permit match ipv6 prefix-list RNUNCOND6
set policy route-map RNIN4 rule 910 action permit match ipv4 prefix-list RNUNADV4
set policy route-map RNIN6 rule 910 action permit match ipv6 prefix-list RNUNADV6

set vrf name NVYRRIGHT protocols bgp parameters conditional-advertisement timer 5
set vrf name NVYRRIGHT protocols bgp address-family ipv4-unicast network 198.19.67.1/32
set vrf name NVYRRIGHT protocols bgp address-family ipv4-unicast network 198.19.67.2/32
set vrf name NVYRRIGHT protocols bgp neighbor 198.18.60.1 address-family ipv4-unicast conditional-advertisement advertise-map RNUNADV4 exist-map RNUNCOND4
set vrf name NVYRRIGHT protocols bgp address-family ipv6-unicast network 2001:db8:67::1/128
set vrf name NVYRRIGHT protocols bgp address-family ipv6-unicast network 2001:db8:67::2/128
set vrf name NVYRRIGHT protocols bgp neighbor 2001:db8:60::1 address-family ipv6-unicast conditional-advertisement advertise-map RNUNADV6 exist-map RNUNCOND6
