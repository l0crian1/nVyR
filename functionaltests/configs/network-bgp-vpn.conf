# VPNv4/VPNv6 share the existing MPLS transport and peer processes.
set vrf name RNVPNBLUE table 42080
set vrf name RNVPNRED table 42081
set interfaces dummy dum42080 vrf RNVPNBLUE address 198.19.80.1/32 address 2001:db8:80::1/128
set protocols bgp peer-group RNLURECUR address-family ipv4-vpn soft-reconfiguration inbound
set policy prefix-list ipv4 RNVPN4DENY rule 10 action permit prefix 198.19.80.3/32
set policy route-map RNVPN4IN rule 10 action deny match ipv4 prefix-list RNVPN4DENY
set policy route-map RNVPN4IN rule 20 action permit match extended-community-list RNVPNRT
set policy route-map RNVPN4OUT rule 10 action permit set extended-community route-target 65071:80
set vrf name RNVPNBLUE protocols bgp local-as 65071 parameters router-id 198.19.80.1
set vrf name RNVPNBLUE protocols bgp address-family ipv4-unicast vpn import route-target import 65071:80
set vrf name RNVPNRED protocols bgp local-as 65071 parameters router-id 198.19.80.1
set vrf name RNVPNRED protocols bgp address-family ipv4-unicast vpn import route-target import 65071:81
set vrf name RNVPNBLUE protocols bgp address-family ipv4-unicast network 198.19.80.1/32
set vrf name RNVPNBLUE protocols bgp address-family ipv4-unicast vpn export route-distinguisher 65071:80 label auto
set vrf name RNVPNBLUE protocols bgp address-family ipv4-unicast vpn route-map import RNVPN4IN export RNVPN4OUT
set protocols bgp peer-group RNLURECUR address-family ipv6-vpn soft-reconfiguration inbound
set policy prefix-list ipv6 RNVPN6DENY rule 10 action permit prefix 2001:db8:80::3/128
set policy route-map RNVPN6IN rule 10 action deny match ipv6 prefix-list RNVPN6DENY
set policy route-map RNVPN6IN rule 20 action permit match extended-community-list RNVPNRT
set policy route-map RNVPN6OUT rule 10 action permit set extended-community route-target 65071:80
set vrf name RNVPNBLUE protocols bgp local-as 65071 parameters router-id 198.19.80.1
set vrf name RNVPNBLUE protocols bgp address-family ipv6-unicast vpn import route-target import 65071:80
set vrf name RNVPNRED protocols bgp local-as 65071 parameters router-id 198.19.80.1
set vrf name RNVPNRED protocols bgp address-family ipv6-unicast vpn import route-target import 65071:81
set vrf name RNVPNBLUE protocols bgp address-family ipv6-unicast network 2001:db8:80::1/128
set vrf name RNVPNBLUE protocols bgp address-family ipv6-unicast vpn export route-distinguisher 65071:80 label auto
set vrf name RNVPNBLUE protocols bgp address-family ipv6-unicast vpn route-map import RNVPN6IN export RNVPN6OUT
set policy extended-community-list standard RNVPNRT rule 10 action permit route-target 65071:80

# VPN transport uses OSPF/LDP loopbacks on the existing MPLS link.
set vrf name RNVPNBLUE protocols bgp address-family ipv4-unicast vpn next-hop 198.19.81.1
set vrf name RNVPNBLUE protocols bgp address-family ipv6-unicast vpn next-hop 2001:db8:81::1
set protocols bgp peer-group RNLURECUR address-family ipv4-vpn attribute-unchanged next-hop
set protocols bgp peer-group RNLURECUR address-family ipv6-vpn attribute-unchanged next-hop
set interfaces dummy dum42081 address 198.19.81.1/32
set protocols ospf interface dum42081 area 0 passive
set interfaces dummy dum42081 address 2001:db8:81::1/128
