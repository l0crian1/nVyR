set policy prefix-list ipv4 RNISIS rule 20 action permit prefix 198.19.95.0/24
set policy route-map RNISIS4 rule 10 action permit match ipv4 prefix-list RNISIS
set policy prefix-list ipv6 RNISIS rule 10 action permit prefix 2001:db8:94::1/128
set policy prefix-list ipv6 RNISIS rule 20 action permit prefix 2001:db8:95::/64
set policy route-map RNISIS6 rule 10 action permit match ipv6 prefix-list RNISIS
