# IS-IS shares the BGP/OSPF/RIP transit; only dedicated prefixes are redistributed.
set interfaces dummy dum42061 address 198.19.94.1/32 address 2001:db8:94::1/128
set interfaces dummy dum42061 address 198.19.94.2/32 address 2001:db8:94::2/128
set vrf name NVYRRIGHT protocols static route 198.19.95.0/24 blackhole
set vrf name NVYRRIGHT protocols static route6 2001:db8:95::/64 blackhole
