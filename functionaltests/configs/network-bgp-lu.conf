# LU uses the existing MPLS transit and native peer, with distinct BGP-only
# destinations so an OSPF or LDP route cannot make a failed LU check pass.
set interfaces dummy dum42071 address 198.19.72.1/32 address 2001:db8:72::1/128
set protocols bgp local-as 65071 parameters router-id 198.18.71.1
set protocols bgp parameters labeled-unicast explicit-null both
set protocols bgp peer-group RNLU remote-as 65072
set protocols bgp peer-group RNLU capability dynamic
set protocols bgp neighbor 198.18.71.2 peer-group RNLU
set protocols bgp peer-group RNLU address-family ipv4-labeled-unicast soft-reconfiguration inbound
set protocols bgp peer-group RNLU address-family ipv6-labeled-unicast soft-reconfiguration inbound
set protocols bgp peer-group RNLU address-family ipv4-labeled-unicast addpath receive-limit 4
set protocols bgp peer-group RNLU address-family ipv6-labeled-unicast addpath receive-limit 4
set policy prefix-list ipv4 RNLU4 rule 10 action permit prefix 198.19.72.2/32
set policy prefix-list ipv6 RNLU6 rule 10 action permit prefix 2001:db8:72::2/128
set protocols bgp peer-group RNLU address-family ipv4-labeled-unicast prefix-list in RNLU4
set protocols bgp peer-group RNLU address-family ipv6-labeled-unicast prefix-list in RNLU6
set protocols bgp address-family ipv4-unicast network 198.19.72.1/32
set protocols bgp address-family ipv6-unicast network 2001:db8:72::1/128
