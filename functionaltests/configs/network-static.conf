# Shared static next-hop link and routing domain.
set vrf name NVYRSMOKE table 41001
set interfaces dummy dum997 address 198.18.97.1/24 address 2001:db8:97::1/64 address fe80::97:1/64

# test_opmode_ipv4_routes
set protocols static route 198.19.128.0/24 blackhole

# test_opmode_ipv4_route_selectors
set protocols static route 198.19.129.0/24 blackhole tag 195

# test_opmode_ipv6_routes
set protocols static route6 2001:db8:502::/64 blackhole

# test_opmode_ipv6_route_selectors
set protocols static route6 2001:db8:503::/64 blackhole tag 195

# test_ipv4_blackhole
set protocols static route 198.19.132.0/24 blackhole

# test_ipv6_reject
set protocols static route6 2001:db8:505::/64 reject

# test_disable_and_reenable
set protocols static route 198.19.134.0/24 blackhole

# test_ipv4_reject
set protocols static route 198.19.135.0/24 reject

# test_ipv6_blackhole
set protocols static route6 2001:db8:508::/64 blackhole

# test_ipv4_next_hop
set protocols static route 198.19.137.0/24 next-hop 198.18.97.2

# test_ipv6_next_hop
set protocols static route6 2001:db8:510::/64 next-hop 2001:db8:97::2

# test_interface_only_routes
set protocols static route 198.19.139.0/24 interface dum997
set protocols static route6 2001:db8:511::/64 interface dum997

# test_gateway_interface_binding
set protocols static route 198.19.140.0/24 next-hop 198.18.97.2 interface dum997
set protocols static route6 2001:db8:512::/64 next-hop 2001:db8:97::2 interface dum997

# test_onlink_gateways
set protocols static route 198.19.141.0/24 next-hop 198.18.98.2 interface dum997
set protocols static route 198.19.141.0/24 next-hop 198.18.98.2 onlink
set protocols static route6 2001:db8:513::/64 next-hop 2001:db8:98::2 interface dum997
set protocols static route6 2001:db8:513::/64 next-hop 2001:db8:98::2 onlink

# test_link_local_and_ipv4_over_ipv6
set protocols static route 198.19.142.0/24 next-hop fe80::97:2 interface dum997
set protocols static route6 2001:db8:514::/64 next-hop fe80::97:2 interface dum997

# test_ipv4_multipath_and_next_hop_disable
set protocols static route 198.19.143.0/24 next-hop 198.18.97.2
set protocols static route 198.19.143.0/24 next-hop 198.18.97.3

# test_ipv6_weighted_multipath
set protocols static route6 2001:db8:516::/64 next-hop 2001:db8:97::2 weight 2
set protocols static route6 2001:db8:516::/64 next-hop 2001:db8:97::3 weight 3

# test_distance_selection_and_fallback
set protocols static route 198.19.145.0/24 next-hop 198.18.97.2 distance 10
set protocols static route 198.19.145.0/24 blackhole distance 200

# test_metric_selection_and_tag_update
set protocols static route 198.19.146.0/24 next-hop 198.18.97.2 metric 20
set protocols static route 198.19.146.0/24 next-hop 198.18.97.2 tag 123
set protocols static route 198.19.146.0/24 next-hop 198.18.97.3 metric 40

# test_interface_path_options_and_disable
set protocols static route 198.19.147.0/24 interface dum997 distance 10
set protocols static route 198.19.147.0/24 interface dum997 metric 20
set protocols static route 198.19.147.0/24 interface dum997 tag 123
set protocols static route 198.19.147.0/24 interface dum997 weight 2
set protocols static route 198.19.147.0/24 reject distance 200

# test_discard_path_options_and_disable
set protocols static route 198.19.148.0/24 blackhole distance 10
set protocols static route 198.19.148.0/24 blackhole metric 20
set protocols static route 198.19.148.0/24 blackhole tag 123
set protocols static route 198.19.148.0/24 reject distance 30
set protocols static route 198.19.148.0/24 reject metric 40
set protocols static route 198.19.148.0/24 reject tag 456
set protocols static route 198.19.148.0/24 reject disable

# test_descriptions_and_implicit_defaults
set protocols static route 198.19.149.0/24 description "Test destination"
set protocols static route 198.19.149.0/24 next-hop 198.18.97.2 description "Primary gateway"

# test_ipv6_prefix_disable
set protocols static route6 2001:db8:522::/64 next-hop 2001:db8:97::2

# test_source_specific_routes
set protocols static route6 2001:db8:523::/64 blackhole
set protocols static route6 2001:db8:523::/64 source-specific from 2001:db8:200::/64 next-hop 2001:db8:97::2
set protocols static route6 2001:db8:523::/64 source-specific from 2001:db8:300::/64 interface dum997

# test_source_specific_disable_and_delete
set protocols static route6 2001:db8:524::/64 source-specific from 2001:db8:200::/64 blackhole
set protocols static route6 2001:db8:524::/64 source-specific from 2001:db8:300::/64 reject

# test_next_hop_vrf_resolution
set vrf name NVYRSMOKE protocols static route 198.19.154.0/24 next-hop 198.18.97.2 vrf default
set vrf name NVYRSMOKE protocols static route6 2001:db8:526::/64 next-hop 2001:db8:97::2 vrf default

# test_ipv4_weighted_multipath
set protocols static route 198.19.157.0/24 next-hop 198.18.97.2 weight 2
set protocols static route 198.19.157.0/24 next-hop 198.18.97.3 weight 3

# test_next_hop_deletion
set protocols static route 198.19.158.0/24 next-hop 198.18.97.2
set protocols static route 198.19.158.0/24 next-hop 198.18.97.3

# test_disabled_prefix_allows_inactive_paths
set protocols static route6 2001:db8:531::/64 disable
set protocols static route6 2001:db8:531::/64 next-hop fe80::97:2

# test_source_specific_path_options
set protocols static route6 2001:db8:532::/64 source-specific from 2001:db8:200::/64 description "Source group"
set protocols static route6 2001:db8:532::/64 source-specific from 2001:db8:200::/64 next-hop 2001:db8:97::2 distance 10
set protocols static route6 2001:db8:532::/64 source-specific from 2001:db8:200::/64 next-hop 2001:db8:97::2 metric 20
set protocols static route6 2001:db8:532::/64 source-specific from 2001:db8:200::/64 next-hop 2001:db8:97::2 tag 123
set protocols static route6 2001:db8:532::/64 source-specific from 2001:db8:200::/64 next-hop 2001:db8:97::2 weight 2
set protocols static route6 2001:db8:532::/64 source-specific from 2001:db8:200::/64 reject distance 200

# test_vrf_source_specific_route
set vrf name NVYRSMOKE protocols static route6 2001:db8:533::/64 source-specific from 2001:db8:200::/64 reject
