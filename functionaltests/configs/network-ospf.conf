# OSPF shares the routed-network transit and VRFs. Dedicated destinations avoid
# masking withdrawals or filtering results tested by the BGP cases.
set interfaces dummy dum42069 vrf NVYRRIGHT address 198.19.90.1/32 address 2001:db8:90::1/128

set policy key-chain RNOSPF key 1 secret routed-network-ospf algorithm hmac-sha-256
set policy key-chain RNOSPF key 1 accept-lifetime start 1993-01-01T00:00:00 infinite
set policy key-chain RNOSPF key 1 send-lifetime start 1993-01-01T00:00:00 infinite

set vrf name NVYRLEFT protocols ospf options router-id 198.18.60.1
set vrf name NVYRRIGHT protocols ospf options router-id 198.18.60.2
set vrf name NVYRLEFT protocols ospf interface veth42061 area 0 network point-to-point
set vrf name NVYRRIGHT protocols ospf interface veth42062 area 0 network point-to-point
set vrf name NVYRLEFT protocols ospf interface veth42061 hello-interval 1 dead-interval 4 cost 20 authentication key-chain RNOSPF
set vrf name NVYRRIGHT protocols ospf interface veth42062 hello-interval 1 dead-interval 4 cost 20 authentication key-chain RNOSPF
set vrf name NVYRRIGHT protocols ospf interface dum42069 area 0 passive

set vrf name NVYRLEFT protocols ospfv3 options router-id 198.18.60.1
set vrf name NVYRRIGHT protocols ospfv3 options router-id 198.18.60.2
set vrf name NVYRLEFT protocols ospfv3 interface veth42061 area 0 network point-to-point
set vrf name NVYRRIGHT protocols ospfv3 interface veth42062 area 0 network point-to-point
set vrf name NVYRLEFT protocols ospfv3 interface veth42061 hello-interval 1 dead-interval 4 cost 20 authentication key-chain RNOSPF
set vrf name NVYRRIGHT protocols ospfv3 interface veth42062 hello-interval 1 dead-interval 4 cost 20 authentication key-chain RNOSPF
set vrf name NVYRRIGHT protocols ospfv3 interface dum42069 area 0 passive

# Route-map metric types and tags are exercised on separate redistributed routes.
set vrf name NVYRRIGHT protocols static route 198.19.91.0/24 blackhole
set vrf name NVYRRIGHT protocols static route6 2001:db8:91::/64 blackhole
set policy prefix-list ipv4 RNOSPF rule 10 action permit prefix 198.19.91.0/24
set policy prefix-list ipv6 RNOSPF rule 10 action permit prefix 2001:db8:91::/64
set policy route-map RNOSPF4 rule 10 action permit match ipv4 prefix-list RNOSPF
set policy route-map RNOSPF4 rule 10 set metric 30 metric-type type-1 tag 91
set policy route-map RNOSPF6 rule 10 action permit match ipv6 prefix-list RNOSPF
set policy route-map RNOSPF6 rule 10 set metric 40 metric-type type-2 tag 91
set vrf name NVYRRIGHT protocols ospf redistribute static route-map RNOSPF4
set vrf name NVYRRIGHT protocols ospfv3 redistribute static route-map RNOSPF6
