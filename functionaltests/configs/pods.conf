# test_ipv4_pod_shared_localhost
set container network PODLAN4 subnet 198.18.240.0/24
set container pod POD4 network PODLAN4 address 198.18.240.10
set container name P4FIRST image @IMAGE@
set container name P4FIRST pod POD4
set container name P4SECOND image @IMAGE@
set container name P4SECOND pod POD4

# test_pod_member_change_preserves_sibling
set container pod PODMEM
set container name PMFIRST image @IMAGE@
set container name PMFIRST pod PODMEM
set container name PMSECOND image @IMAGE@
set container name PMSECOND pod PODMEM

# test_pod_disable_restart_and_hostname
set container pod PODLIFE host-name shared-host
set container name PLFIRST image @IMAGE@
set container name PLFIRST pod PODLIFE

# test_ipv6_pod_attachment
set container network PODLAN6 subnet fd00:230::/64
set container pod POD6 network PODLAN6 address fd00:230::10
set container name P6FIRST image @IMAGE@
set container name P6FIRST pod POD6
