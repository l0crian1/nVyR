# CGN shares the existing routed hosts, VRFs and LANs. Dedicated TCP/UDP ports
# isolate it from other firewall probes; ICMP is restricted to a distinct host alias.
set nat cgnat pool RNCGN public-address 198.18.62.1 port-range 40000-41999 block-size 1000
set nat cgnat rule 42600 source-address 198.18.61.2 pool RNCGN vrf NVYRRIGHT outbound-interface veth42065 protocol tcp protocol udp destination-port 52600-52601 counter
set nat cgnat rule 42601 source-address 198.18.61.2 pool RNCGN vrf NVYRRIGHT outbound-interface veth42065 protocol icmp destination-address 198.19.62.2 counter
set firewall ipv4 forward filter rule 42600 protocol tcp protocol udp destination-port 52600-52601 action accept
set firewall ipv4 forward filter rule 42601 protocol tcp protocol udp source-port 52600-52601 action accept
set firewall ipv4 forward filter rule 42602 protocol icmp destination-address 198.19.62.2 action accept
set firewall ipv4 forward filter rule 42603 protocol icmp source-address 198.19.62.2 action accept

