# Shared service listeners and routing domains.
set vrf name NVYRDHCPSMOKE table 41980
set interfaces dummy dum980 vrf NVYRDHCPSMOKE address 198.18.210.1/24 address 2001:db8:210::1/64
set vrf name NTPTEST table 41977
set interfaces dummy dum977 vrf NTPTEST address 198.18.197.1/24
set system logging level info

# test_ipv4_operational_views
set vrf name NVYRDHCPSMOKE service dhcp-server listen-interface dum980
set vrf name NVYRDHCPSMOKE service dhcp-server shared-network LAN subnet 198.18.210.0/24 range 198.18.210.10-198.18.210.20

# test_ipv6_operational_views
set vrf name NVYRDHCPSMOKE service dhcpv6-server listen-interface dum980
set vrf name NVYRDHCPSMOKE service dhcpv6-server shared-network LAN subnet 2001:db8:210::/64 range 2001:db8:210::10-2001:db8:210::20

# test_ipv4_disable_stops_instance

# test_ipv4_server_and_client_access
set system ntp server 192.0.2.123 prefer
set system ntp listen-address ipv4 127.0.0.1
set system ntp allow-client 192.0.2.0/24

# test_ipv6_server_and_client_access
set system ntp server 2001:db8::123
set system ntp listen-address ipv6 ::1
set system ntp allow-client 2001:db8::/64

# test_ipv4_client_activity_and_server_statistics
set system ntp allow-client 127.0.0.1

# test_ipv6_client_activity_and_server_statistics
set system ntp allow-client ::1

# test_service_removal
set system ntp server 192.0.2.123

# test_pool_and_nts_without_dns
set system ntp server time.example.invalid nts prefer
set system ntp pool pool.example.invalid nts

# test_global_rotation_and_service_override
set system logging rotation size 64m count 3
set system logging service bgp level debug

# test_ipv4_nflog_group_and_exact_input_rule
set firewall group log-group SMOKELOG4 snaplen 128 queue-threshold 1
set firewall ipv4 input filter rule 10 action accept protocol icmp destination-address 127.0.0.1 log group SMOKELOG4

# test_ipv6_nflog_group_and_exact_input_rule
set firewall group log-group SMOKELOG6 snaplen 256
set firewall ipv6 input filter rule 10 action accept protocol ipv6-icmp destination-address ::1 log group SMOKELOG6

# Default-VRF flowtable accounting uses independent host links on the same scenario.
set interfaces virtual-ethernet veth41050 peer-name veth41051 address 198.18.50.1/30 address 2001:db8:5050::1/64
set interfaces virtual-ethernet veth41051 peer-name veth41050
set interfaces virtual-ethernet veth41052 peer-name veth41053 address 198.18.51.1/30 address 2001:db8:5051::1/64
set interfaces virtual-ethernet veth41053 peer-name veth41052
