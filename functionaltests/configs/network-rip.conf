# RIP shares the routed-network interfaces and VRFs with BGP and OSPF.
# Dedicated connected and static destinations cannot be satisfied by those protocols.
set interfaces dummy dum42061 address 198.19.92.1/32 address 2001:db8:92::1/128
set interfaces dummy dum42061 address 198.19.92.2/32 address 2001:db8:92::2/128
set policy key-chain RNRIP key 1 secret routed-rip algorithm md5
set vrf name NVYRRIGHT protocols static route 198.19.93.0/24 blackhole
set vrf name NVYRRIGHT protocols static route6 2001:db8:93::/64 blackhole
set policy prefix-list ipv4 RNRIP rule 10 action permit prefix 198.19.92.1/32
set policy prefix-list ipv4 RNRIP rule 20 action permit prefix 198.19.93.0/24
set policy access-list ipv4 RNRIP rule 10 action permit prefix 198.19.92.1/32
set policy route-map RNRIP4 rule 10 action permit match ipv4 prefix-list RNRIP
set policy route-map RNRIP4 rule 10 set metric 3 tag 92
set vrf name NVYRLEFT protocols rip timers update 2 timeout 12 garbage-collection 8
set vrf name NVYRLEFT protocols rip maximum-paths 4
set vrf name NVYRLEFT protocols rip interface veth42061 passive disable
set vrf name NVYRLEFT protocols rip version 2 passive-default
set vrf name NVYRLEFT protocols rip interface veth42061 authentication mode md5 key-chain RNRIP
set vrf name NVYRLEFT protocols rip interface veth42061 distribute-list in prefix-list RNRIP
set vrf name NVYRLEFT protocols rip interface veth42061 offset-list in access-list RNRIP metric 2
set vrf name NVYRRIGHT protocols rip timers update 2 timeout 12 garbage-collection 8
set vrf name NVYRRIGHT protocols rip maximum-paths 4
set vrf name NVYRRIGHT protocols rip interface veth42062 passive disable
set vrf name NVYRRIGHT protocols rip version 2 passive-default
set vrf name NVYRRIGHT protocols rip interface veth42062 authentication mode md5 key-chain RNRIP
set vrf name NVYRRIGHT protocols rip redistribute connected route-map RNRIP4
set vrf name NVYRRIGHT protocols rip redistribute static route-map RNRIP4
set policy prefix-list ipv6 RNRIP rule 10 action permit prefix 2001:db8:92::1/128
set policy prefix-list ipv6 RNRIP rule 20 action permit prefix 2001:db8:93::/64
set policy access-list ipv6 RNRIP rule 10 action permit prefix 2001:db8:92::1/128
set policy route-map RNRIP6 rule 10 action permit match ipv6 prefix-list RNRIP
set policy route-map RNRIP6 rule 10 set metric 3 tag 92
set vrf name NVYRLEFT protocols ripng timers update 2 timeout 12 garbage-collection 8
set vrf name NVYRLEFT protocols ripng maximum-paths 4
set vrf name NVYRLEFT protocols ripng interface veth42061 passive disable
set vrf name NVYRLEFT protocols ripng interface veth42061 distribute-list in prefix-list RNRIP
set vrf name NVYRLEFT protocols ripng interface veth42061 offset-list in access-list RNRIP metric 2
