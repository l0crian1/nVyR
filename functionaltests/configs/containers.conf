# test_container_device
set container name CTDEVICE image @IMAGE@
set container name CTDEVICE device /dev/null destination /dev/test-null
set container name CTDEVICE device /dev/null permissions rw

# test_container_hostname
set container name CTHOST image @IMAGE@
set container name CTHOST host-name smoke-container

# test_connect_container_command
set container name CTCONNECT image @IMAGE@
set container name CTCONNECT host-name smoke-container

# test_container_tmpfs
set container name CTTMPFS image @IMAGE@
set container name CTTMPFS tmpfs /scratch size 8m
set container name CTTMPFS tmpfs /scratch mode 1777

# test_container_environment_file
set container name CTENV image @IMAGE@
set container name CTENV environment-file @ENV@
set container name CTENV environment SMOKE_OVERRIDE value explicit

# test_disable_and_reenable
set container name CTDISABLE image @IMAGE@

# test_network_dns_alias
set container network CTLAN subnet 198.18.230.0/24
set container name CTDNS image @IMAGE@
set container name CTDNS network CTLAN address 198.18.230.10
set container name CTDNS network CTLAN alias smoke-service

# test_environment_literal_values
set container name CTLITERAL image @IMAGE@
set container name CTLITERAL environment SMOKE_LITERAL value "$HOME %n two words"

# test_restart_after_failure
set container name CTFAIL image @IMAGE@

# test_unrelated_commit_preserves_workload
set container name CTKEEP image @IMAGE@

# test_network_edit_recreates_attached_workload
set container network CTEDITNET subnet 198.18.231.0/24
set container name CTNETEDIT image @IMAGE@
set container name CTNETEDIT network CTEDITNET

# test_persistent_volume_survives_recreation
set container name CTVOLUME image @IMAGE@
set container name CTVOLUME volume DATA source @VOLUME@
set container name CTVOLUME volume DATA destination /data
set container name CTVOLUME volume DATA owner user root group 0 recursive
set container name CTVOLUME volume DATA mode 0750

set container name CTVOLUME volume HOSTFILE source @HOSTFILE@
set container name CTVOLUME volume HOSTFILE destination /host-name
set container name CTVOLUME volume HOSTFILE read-only

# test_show_containers
set container name CTSHOW image @IMAGE@
set container name CTSHOW environment SMOKE_SECRET value do-not-display-this

# test_show_disabled_container
set container name CTDISABLED image @IMAGE@
set container name CTDISABLED disable

# test_show_container_network_inventory
set vrf name CTVRF table 28405
set container network CTVRFNET subnet 198.18.235.0/24 gateway 198.18.235.1
set container network CTVRFNET vrf CTVRF disable-dns
set container name CTNETVIEW image @IMAGE@
set container name CTNETVIEW network CTVRFNET address 198.18.235.10

# test_show_container_image_inventory
set container name CTIMAGES image @IMAGE@

# test_show_container_statistics
set container name CTSTATS image @IMAGE@

# test_restart_container
set container name CTRESTART image @IMAGE@

# test_restart_disabled_container_rejected
set container name CTNOREST image @IMAGE@
set container name CTNOREST disable

# test_container_capability
set container name CTCAP image @IMAGE@
set container name CTCAP capability net-admin
set container name CTCAP no-new-privileges

# test_ipv6_static_attachment
set container network CTIP6NET subnet fd00:198:18:230::/64
set container name CTIPV6 image @IMAGE@
set container name CTIPV6 network CTIP6NET address fd00:198:18:230::10

# test_dual_stack_attachment
set container network CTDUALNET subnet 198.18.233.0/24
set container network CTDUALNET subnet fd00:198:18:233::/64
set container name CTDUAL image @IMAGE@
set container name CTDUAL network CTDUALNET address 198.18.233.10
set container name CTDUAL network CTDUALNET address fd00:198:18:233::10

# test_default_network_isolation
set container name CTNONE image @IMAGE@

# test_resource_overrides_and_removal
set container name CTRES image @IMAGE@
set container name CTRES memory 128m cpus 0.5 process-limit 64

# test_published_tcp_port
set container network CTLAN subnet 198.18.230.0/24
set container name CTPTCP image @IMAGE@
set container name CTPTCP network CTLAN
set container name CTPTCP port WEB protocol tcp
set container name CTPTCP port WEB source-address 127.0.0.1
set container name CTPTCP port WEB source-port @TCP_PORT@
set container name CTPTCP port WEB destination-port 8080

# test_published_udp_port
set container network CTLAN subnet 198.18.230.0/24
set container name CTPUDP image @IMAGE@
set container name CTPUDP network CTLAN
set container name CTPUDP port DNS protocol udp
set container name CTPUDP port DNS source-address 127.0.0.1
set container name CTPUDP port DNS source-port @UDP_PORT@
set container name CTPUDP port DNS destination-port 5353
