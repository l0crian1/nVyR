# Imported maps share the routed topology; dedicated ports do not affect other cases.
set firewall group map ipv4 RNFEED match source-address destination-address destination-port protocol
set firewall group map ipv4 RNFEED result-type verdict
set firewall group map ipv4 RNFEED default-result action continue
set firewall group map ipv4 RNFEED from-csv POLICY source /run/nvyr-routed-feeds/ipv4.csv
set firewall group map ipv4 RNFEED from-csv POLICY column source-address 1 destination-address 2 destination-port 3 protocol 4 result action 5
set firewall ipv4 forward filter rule 41901 map RNFEED
set firewall group match-group ipv6 RNFEED match source-address destination-address destination-port protocol
set firewall group match-group ipv6 RNFEED from-csv POLICY source /run/nvyr-routed-feeds/ipv6.csv
set firewall group match-group ipv6 RNFEED from-csv POLICY column source-address 1 destination-address 2 destination-port 3 protocol 4
set firewall ipv6 forward filter rule 41901 match-group RNFEED action drop
