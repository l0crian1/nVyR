# One extra default-VRF link into the existing right-side simulated host.
# LDP, OSPF synchronization and labeled IPv4/IPv6 probes share this link.
set interfaces virtual-ethernet veth42071 peer-name veth42072 address 198.18.71.1/30 address 2001:db8:71::1/64
set interfaces virtual-ethernet veth42072 peer-name veth42071
set protocols mpls interface veth42071
set interfaces dummy dum42071
set protocols mpls interface dum42071
set protocols ldp options router-id 198.18.71.1
set protocols ldp options dual-stack transport-preference ipv4
set protocols ldp discovery hello interval 1 holdtime 6
set protocols ldp address-family ipv4 transport-address 198.18.71.1 interface veth42071
set protocols ldp address-family ipv6 transport-address 2001:db8:71::1 interface veth42071
set protocols ospf options router-id 198.18.71.1
set protocols ospf interface veth42071 area 0 network point-to-point hello-interval 1 dead-interval 4
set protocols ospf ldp-sync hold-down 30
set protocols ospf interface veth42071 ldp-sync hold-down 30
set protocols static route6 2001:db8:64::2/128 next-hop 2001:db8:71::2 interface veth42071
