# One extra default-VRF link into the existing right-side simulated host.
# LDP, OSPF synchronization and labeled IPv4/IPv6 probes share this link.
set interfaces virtual-ethernet veth42071 peer-name veth42072 address 198.18.71.1/30 address 2001:db8:71::1/64 mtu 1504
set interfaces virtual-ethernet veth42072 peer-name veth42071 mtu 1504
set interfaces virtual-ethernet veth42073 peer-name veth42074 address 198.18.73.1/30 address 2001:db8:73::1/64 mtu 1600
set interfaces virtual-ethernet veth42074 peer-name veth42073 mtu 1600
set protocols mpls interface veth42073 fec nexthop-resolution
set protocols mpls lsp 17000 next-hop 198.18.71.2 outgoing-label implicit-null
set protocols mpls lsp 17001 next-hop 198.18.71.2 outgoing-label 18000
set protocols mpls lsp 17002 next-hop 2001:db8:71::2 outgoing-label implicit-null
set protocols mpls lsp 17003 next-hop 2001:db8:71::2 outgoing-label 18002
set protocols static route 198.19.73.2/32 next-hop 198.18.71.2 label 18000
set protocols static route6 2001:db8:74::2/128 next-hop 2001:db8:71::2 label 18002
set protocols mpls interface veth42071
set interfaces dummy dum42071
set protocols mpls interface dum42071
set protocols ldp options router-id 198.18.71.1
set protocols ldp options dual-stack transport-preference ipv4
set protocols ldp discovery hello interval 1 holdtime 6
set protocols ldp address-family ipv4 transport-address 198.18.71.1 interface veth42071
set protocols ldp address-family ipv6 transport-address 2001:db8:71::1 interface veth42071
set protocols ospf options router-id 198.18.71.1
set protocols ospf interface veth42071 area 0 network point-to-point hello-interval 1 dead-interval 4
set protocols ospf ldp-sync hold-down 30
set protocols ospf interface veth42071 ldp-sync hold-down 30
set protocols static route6 2001:db8:64::2/128 next-hop 2001:db8:71::2 interface veth42071
set protocols static route6 2001:db8:77::2/128 next-hop 2001:db8:71::2 interface veth42071

# MPLS transit bypasses IP conntrack; its plain-IP echo replies must be untracked.
set firewall ipv4 prerouting raw rule 42730 destination-address 198.18.73.2 protocol icmp notrack action accept
set firewall ipv6 prerouting raw rule 42730 destination-address 2001:db8:73::2 protocol ipv6-icmp notrack action accept
