# Runtime profiles are reconstructed from the saved nVyR configuration on boot.
d /run/sysctl.d 0755 root root -
d /run/nvyr-kernel-settings 0700 root root -
# SSH and console logins only record active sessions when this file exists.
# Lowercase f creates it without truncating existing login records on upgrades.
f /run/utmp 0664 root utmp -

d /run/nvyr-logging 0755 root root -
d /var/log/nvyr 0750 root nvyr-access -
d /var/log/nvyr/containers 0750 root nvyr-access -
d /var/log/nvyr/firewall 0750 root nvyr-access -
d /var/log/nvyr/dhcp-server 0750 root nvyr-access -
d /var/log/nvyr/dhcpv6-server 0750 root nvyr-access -

d /run/nvyr-frr 0750 root frr -
d /run/nvyr-ssh 0700 root root -
d /run/nvyr-ntp 0700 root root -
d /config/ntp 0750 _chrony _chrony -
d /run/nvyr-kea 0700 root root -
d /run/nvyr-containers 0700 root root -
d /config/containers 0700 root root -
d /config/podman 0700 root root -
d /run/sshd 0755 root root -
d /config 1775 root nvyr-access -
d /config/.nvyr 0700 root root -
d /config/nvyr-images 2775 root nvyr-access -
# Interactive sessions receive only their private workspace and the configd socket.
d /config/users 0755 root root -
d /run/nvyr-sessions 0755 root root -
d /run/nvyr-sessions/sessions 0700 root root -
d /var/lib/nvyr-sessions 0700 root root -
d /run/nvyr-developer 0755 root root -
