[Unit]
# Use the nVyR baseline even when Debian's example configuration is absent.
ConditionFileNotEmpty=
AssertFileNotEmpty=/usr/lib/nvyr/router.nft

[Service]
ExecStart=
ExecStart=/usr/sbin/nft --file /usr/lib/nvyr/router.nft
# Reloading only the baseline would discard configured firewall policy.
# Restart instead: configd's PartOf dependency replays configuration afterward.
ExecReload=
# Preserve filtering when stopping the service or shutting down.
ExecStop=
