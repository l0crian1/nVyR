name: Build and test
on: [push, pull_request]

permissions:
  contents: read

# A newer revision supersedes earlier tests on the same branch or pull request.
concurrency:
  group: framework-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build test container
        run: docker build -t nvyr-test -f tests/container/Dockerfile .
      - name: Run tests and package builds
        run: docker run --rm -v "$PWD:/workspace" nvyr-test
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: framework-python-3.13
          path: test-results/framework.xml
          if-no-files-found: ignore
