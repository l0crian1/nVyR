name: Publish image builder

on:
  push:
    branches: [main]
    paths: [images/Dockerfile]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishing so concurrent builds cannot race to update latest.
concurrency:
  group: publish-image-builder
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The first uncached build includes the full Debian-configured LTS kernel.
    timeout-minutes: 360

    steps:
      - name: Check out source and version history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check builder version
        id: version
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess

          marker = re.compile(r'# builder-version: (0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)')
          first_line = Path('images/Dockerfile').read_text().splitlines()[0]
          current = marker.fullmatch(first_line)
          if current is None:
              raise SystemExit('Dockerfile must start with # builder-version: MAJOR.MINOR.PATCH')

          version = '.'.join(current.groups())
          publish = True
          before = os.environ.get('BEFORE_SHA', '')
          if os.environ['EVENT_NAME'] == 'push' and before and set(before) != {'0'}:
              previous_file = subprocess.run(
                  ['git', 'show', f'{before}:images/Dockerfile'],
                  check=True, capture_output=True, text=True,
              ).stdout
              previous = marker.fullmatch(previous_file.splitlines()[0])
              if previous is not None:
                  current_number = tuple(map(int, current.groups()))
                  previous_number = tuple(map(int, previous.groups()))
                  if current_number < previous_number:
                      raise SystemExit('Builder version must increase, not decrease.')
                  publish = current_number != previous_number

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'publish={str(publish).lower()}\n')

          if publish:
              print(f'Publishing builder {version} and latest.')
          else:
              print(f'Builder version is still {version}; skipping publication.')

      - name: Make room for kernel compilation
        if: steps.version.outputs.publish == 'true'
        run: |
          # BTF generation retains debug information until module packaging.
          # These hosted-runner SDKs are unused by the isolated Docker build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: images/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            l0crian/nvyr-image-builder:${{ steps.version.outputs.version }}
            l0crian/nvyr-image-builder:latest
          labels: |
            org.opencontainers.image.title=nVyR image builder
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=nvyr-image-builder
          cache-to: type=gha,scope=nvyr-image-builder,mode=max,ignore-error=true
